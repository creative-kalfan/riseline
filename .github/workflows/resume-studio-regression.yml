name: Resume Studio Standing Regression Guard

# Monorepo: backend lives under backend/ (migrated from backend via git subtree).

on:
  push:
    paths:
      - 'backend/app/services/resume_parser/**'
      - 'backend/app/services/resumes/**'
      - 'backend/app/services/ats/**'
      - 'backend/tests/**'
      - '.github/workflows/resume-studio-regression.yml'
  pull_request:
    paths:
      - 'backend/app/services/resume_parser/**'
      - 'backend/app/services/resumes/**'
      - 'backend/app/services/ats/**'
      - 'backend/tests/**'
      - '.github/workflows/resume-studio-regression.yml'

jobs:
  regression-guard:
    name: Resume Studio E2E Regression & Visual Golden Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-playwright
          playwright install --with-deps chromium

      - name: Run Resume Studio Consolidated Regression Suite
        run: |
          pytest tests/test_resume_studio_regression.py -v
