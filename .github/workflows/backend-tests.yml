name: Backend Hermetic Test Suite

# Monorepo: backend lives under backend/ (migrated from careeros-backend-py via git subtree).
# working-directory is backend/ so `pip install -r requirements.txt` and `pytest`
# resolve correctly in the monorepo layout.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run hermetic test suite
        working-directory: backend
        env:
          GROQ_API_KEY: ""
        run: |
          python -m pytest
